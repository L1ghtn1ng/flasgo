version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily
      timezone: Europe/London
    open-pull-requests-limit: 10
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  cooldown:
    default-days: 7
  patterns: ["*"]
  multi-ecosystem-group: all-dependencies
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  cooldown:
    default-days: 7
  patterns: ["*"]
  multi-ecosystem-group: all-dependencies
  allow:
  # Includes project dependencies, optional extras, dependency groups, and transitive dependencies.
  - dependency-type: all
