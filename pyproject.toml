[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flasgo"
version = "0.10.0"
description = "Async-first Python web framework with Flask ergonomics and Django-inspired security defaults."
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jay Townsend" }]
maintainers = [{ name = "Jay Townsend" }]
keywords = ["asgi", "async", "flasgo", "framework", "jinja2", "security", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "uvicorn[standard]==0.52.4",
    "Jinja2==3.1.6",
    "watchfiles==1.2.0",
]

[project.optional-dependencies]
db = ["alembic==1.19.2"]
jwt = ["PyJWT==2.13.0"]
metrics = ["prometheus-client==0.26.0"]
otel = [
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-asgi==0.65b0",
    "opentelemetry-sdk==1.44.0",
]
redis = ["redis==8.1.0"]

[project.urls]
Homepage = "https://flasgo.dev"
Documentation = "https://flasgo.dev"
Repository = "https://github.com/L1ghtn1ng/flasgo"
Issues = "https://github.com/L1ghtn1ng/flasgo/issues"
Releases = "https://github.com/L1ghtn1ng/flasgo/releases"
License = "https://github.com/L1ghtn1ng/flasgo/blob/main/LICENSE"

[project.scripts]
flasgo = "flasgo.cli:main"

[dependency-groups]
dev = [
  "alembic==1.19.2",
  "PyJWT==2.13.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-asgi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "openapi-spec-validator==0.9.0",
  "prometheus-client==0.26.0",
  "pytest==9.1.1",
  "redis==8.1.0",
  "ruff==0.16.6",
  "ty==0.0.79",
]

[tool.hatch.build.targets.sdist]
# An explicit list keeps untracked local files (editor, agent, and shell config) out of source distributions.
include = [
    "/flasgo",
    "/tests",
    "/benchmarks",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/MIGRATING_FROM_FLASK.md",
    "/METRICS.md",
    "/release.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py314"
# "." makes the flasgo package first-party for import sorting; "tests" covers tests/_helpers.py.
src = [".", "tests"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
    "SIM",
    "PIE",
    "PERF",
    "C4",
    "DTZ",
    "ERA",
    "FLY",
    "FURB",
    "G",
    "INP",
    "ISC",
    "LOG",
    "PGH",
    "PLR1711",
    "PLR1714",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "S",
    "SLOT",
    "T20",
    "TID",
]

ignore = [
    "RUF036",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed tokens, pickle round-trips, spawn helper processes, and pass 0.0.0.0 to the CLI.
"tests/**" = ["S101", "S104", "S105", "S106", "S301", "S603"]
"flasgo/{cli,server}.py" = ["T201"]
"benchmarks/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
pythonpath = ["."]
strict = true
filterwarnings = ["error"]
faulthandler_timeout = 60

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["flasgo", "tests", "benchmarks"]

[tool.ty.terminal]
error-on-warning = true
